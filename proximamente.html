<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximamente - Gente Vigente</title>
    <link rel="icon" type="image/png" href="img/LogoGVNB.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Variables del proyecto */
        :root {
            --primary-color: #E4B948;
            --secondary-color: #1a1a1a;
            --background-color: #fafafa;
            --text-color: #666;
            --highlight-color: #EEC851;
            --primary-gradient: linear-gradient(135deg, #CC9432, #E4B948, #EEC851);
            --primary-gradient-inverted: linear-gradient(135deg, #EEC851, #E4B948, #CC9432);
            --background-gradient: linear-gradient(180deg, #fafafa, #fff7eb);
            --logo-gradient: linear-gradient(45deg, #CC9432, #E4B948, #EEC851, #E4B948);
            --logo-shadow: 0 0 30px rgba(228, 185, 72, 0.4), 0 0 60px rgba(238, 200, 81, 0.2);
            --card-shadow: 0 10px 30px rgba(228, 185, 72, 0.15);
            --button-shadow: 0 8px 25px rgba(228, 185, 72, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            position: relative;
            padding: 1rem;
        }

        .geometric-lines {
    position: absolute;
    top: 0;
    right: 0;
    width: 60%;
    height: 100%;
    background: 
        linear-gradient(45deg, transparent 30%, rgba(228, 185, 72, 0.03) 30.5%, rgba(228, 185, 72, 0.03) 31%, transparent 31.5%),
        linear-gradient(-45deg, transparent 30%, rgba(238, 200, 81, 0.02) 30.5%, rgba(238, 200, 81, 0.02) 31%, transparent 31.5%);
    background-size: 60px 60px;
    opacity: 0.7;
}

.geometric-circle {
    position: absolute;
    top: 20%;
    right: 10%;
    width: 300px;
    height: 300px;
    border: 1px solid rgba(228, 185, 72, 0.15);
    border-radius: 50%;
    animation: rotateCircle 20s linear infinite;
}

.geometric-circle::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 200px;
    height: 200px;
    border: 1px solid rgba(238, 200, 81, 0.1);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: rotateCircle 15s linear infinite reverse;
}

.geometric-circle::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100px;
    height: 100px;
    border: 1px solid rgba(228, 185, 72, 0.4);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: rotateCircle 10s linear infinite;
}

@keyframes rotateCircle {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

        /* Partículas flotantes */
        .floating-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--primary-color);
            border-radius: 50%;
            opacity: 0.4;
            animation: particleFloat 8s infinite linear;
        }

        .particle:nth-child(odd) {
            background: var(--highlight-color);
            animation-duration: 12s;
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 2s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 4s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 1s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 3s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 5s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 7s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 2.5s; }

        /* Contenido principal */
        .main-content {
            text-align: center;
            max-width: 600px;
            z-index: 10;
            position: relative;
        }

        .logo-container {
            margin-bottom: 1rem;
            position: relative;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: var(--logo-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: var(--logo-shadow);
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            animation: logoGlow 3s ease-in-out infinite alternate;
        }

        .tagline {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 1.5rem;
        }

        .coming-soon-badge {
            display: inline-block;
            background: var(--primary-gradient);
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            box-shadow: var(--button-shadow);
            animation: pulse 2s infinite;
        }

        .main-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.8rem;
            line-height: 1.2;
        }

        .description {
            font-size: 1rem;
            line-height: 1.4;
            margin-bottom: 1.5rem;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Contador */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }

        .countdown-item {
            text-align: center;
            min-width: 60px;
        }

        .countdown-number {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
            line-height: 1;
        }

        .countdown-label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 0.3rem;
        }

        /* Redes sociales */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            background: rgba(228, 185, 72, 0.2);
            border-radius: 50%;
            color: var(--primary-color);
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .social-link svg {
    width: 25px;
    height: 25px;
    fill: var(--primary-color);  /* Color dorado normal */
    transition: all 0.3s ease;
}

.social-link:hover svg {
    fill: white;  /* Color blanco al hacer hover */
}

        .social-link:hover {
            background: var(--primary-gradient);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--card-shadow);
        }

        /* Animaciones */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateCircle {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) translateX(0px) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% {
                transform: translateY(-100px) translateX(50px) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes logoGlow {
            0% { filter: drop-shadow(0 0 10px rgba(228, 185, 72, 0.3)); }
            100% { filter: drop-shadow(0 0 20px rgba(228, 185, 72, 0.6)); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeInUp 1s ease-out forwards;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .logo {
                font-size: 2rem;
            }

            .main-title {
                font-size: 1.5rem;
            }

            .description {
                font-size: 0.9rem;
            }

            .countdown {
                gap: 0.8rem;
            }

            .countdown-number {
                font-size: 1.5rem;
            }

            .geometric-circle {
                width: 150px;
                height: 150px;
            }

            .geometric-lines {
                width: 100px;
                height: 100px;
            }

            .rotating-circles {
                left: 2%;
                width: 200px;
                height: 200px;
            }

            .rotating-circle-1 {
                width: 150px;
                height: 150px;
                top: 25px;
                left: 25px;
            }

            .rotating-circle-2 {
                width: 100px;
                height: 100px;
                top: 50px;
                left: 50px;
            }

            .rotating-circle-3 {
                width: 60px;
                height: 60px;
                top: 70px;
                left: 70px;
            }
        }
    </style>
</head>

    <script>
        // Contador regresivo
        function updateCountdown() {
            // Fecha de lanzamiento (puedes cambiar esta fecha)
            const launchDate = new Date('2025-10-15T00:00:00').getTime();
            const now = new Date().getTime();
            const distance = launchDate - now;

            if (distance > 0) {
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = days.toString().padStart(2, '0');
                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            } else {
                // El contador ha llegado a cero
                document.querySelector('.countdown').innerHTML = '<div class="countdown-item"><span class="countdown-number">¡YA!</span></div>';
            }
        }

        // Actualizar cada segundo
        setInterval(updateCountdown, 1000);
        updateCountdown(); // Llamada inicial

        // Animación de entrada
        setTimeout(() => {
            document.querySelector('.main-content').classList.add('fade-in');
        }, 100);
    </script>
